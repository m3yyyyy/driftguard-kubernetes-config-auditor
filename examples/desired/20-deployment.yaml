apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: driftguard-demo
  labels:
    driftguard.io/managed: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: driftguard-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: driftguard-demo
    spec:
      containers:
        - name: web
          image: nginx:1.27.5-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: temporary-files
              mountPath: /tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: temporary-files
          emptyDir: {}
